<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Sign Up Form</title>
        <link rel="stylesheet" href="styles.css">
        <scipt src="script.js" defer></scipt>
    </head>
    <body>
        <div id="section-1">
            <div id="logo">
                <img src="odin-lined.png" class="logo-img">
                <h1>ODIN</h1>
            </div>
            <div class="footer-1">
                <p>Photo by Rafael Garcin on <a href="https://unsplash.com/@nimbus_vulpis">Unsplash</a>.</p>
            </div>
        </div>

        <div id="section-2">
            <div class="header-2">
                <h3>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</h3>
                <h3>Sign up <em>now</em> to get started.</h3>
                <br>
                <h3>You <em>know</em> you want to.</h3>
            </div>
        
            <form id="signup-form" action="" method="get">
                <h3>Lets do this!</h3>
                <div class="user-info">
                    <p>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="firstname">
                    </p>
                    <p>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="lastname">
                    </p>
                    <p>
                        <label for="mail">Email</label>
                        <input type="email" id="mail" name="user-email">
                    </p>
                    <p>
                        <label for="telephone">Phone Number</label>
                        <input type="number" id="telephone" name="telephone-no">
                    </p>
                    <p>
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" name="user-password">
                    </p>
                    <p>
                        <label for="confirm-user-password">Confirm Password</label>
                        <input type="password" id="confirm-user-password" name="confirm-user-password">
                    </p>
                </div>

            </form>
            <div class="footer-2">
                <div class="submit">
                    <button type="submit" form="signup-form">Create Account</button>
                </div>
                <div class="log-in">
                    <p>Already have an account? <a href="">Log in</a>.</p>
                </div>
            </div>
        </div>  
        
    </body>
</html>
